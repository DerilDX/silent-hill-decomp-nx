name: Quick Weapons native build check

on:
  push:
    branches: [feature/quick-weapons]
  workflow_dispatch:

jobs:
  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libjpeg-turbo
      - name: Configure port
        shell: msys2 {0}
        run: cmake -S pc_port -B pc_port/build -G Ninja -DSH_BUILD_MAP_DLLS=OFF
      # MinGW exposes CRT prototypes that collide with PsyCross's PSX card
      # shims. Adapt only the runner's disposable submodule copy; this is NOT
      # a source change to the upstream PsyCross submodule.
      - name: Work around MinGW/PsyCross PSX libc prototypes
        shell: msys2 {0}
        run: |
          f=pc_port/PsyCross/src/psx/libapi.c
          sed -i 's/^int open(char\* path, unsigned int flags)$/int open(const char* path, int flags, ...)/' "$f"
          sed -i 's/^int lseek(int handle, int offset, int whence)$/long lseek(int handle, long offset, int whence)/' "$f"
          sed -i 's/^int read(int handle, void\* buf, int bytes)$/int read(int handle, void* buf, unsigned int bytes)/' "$f"
          sed -i 's/^int write(int handle, void\* buf, int bytes)$/int write(int handle, const void* buf, unsigned int bytes)/' "$f"
          grep -q '^int open(const char\* path, int flags, ...)' "$f"
          grep -q '^long lseek(int handle, long offset, int whence)' "$f"
          grep -q '^int read(int handle, void\* buf, unsigned int bytes)' "$f"
          grep -q '^int write(int handle, const void\* buf, unsigned int bytes)' "$f"
      - name: Build test executable
        shell: msys2 {0}
        run: cmake --build pc_port/build --target SilentHillPC -j 2
      - name: Package matching MinGW runtime
        shell: msys2 {0}
        run: |
          mkdir -p quick-weapons-native-test
          cp pc_port/build/SilentHillPC.exe quick-weapons-native-test/
          # Windows must load the matching DLL from next to the EXE rather
          # than an older copy that lacks clock_gettime64.
          cp /mingw64/bin/libwinpthread-1.dll quick-weapons-native-test/
          cp /mingw64/bin/libgcc_s_seh-1.dll quick-weapons-native-test/
          cp /mingw64/bin/libstdc++-6.dll quick-weapons-native-test/
          # Bundle matching DLLs recursively. The first executable test found
          # a mismatched libopenal-1.dll from an older port installation.
          # This keeps the entire MinGW runtime dependency set consistent.
          shopt -s nullglob
          queue=(quick-weapons-native-test/SilentHillPC.exe)
          while (( ${#queue[@]} > 0 )); do
            file="${queue[0]}"
            queue=("${queue[@]:1}")
            while IFS= read -r dll; do
              if [[ -f "/mingw64/bin/$dll" && ! -f "quick-weapons-native-test/$dll" ]]; then
                cp "/mingw64/bin/$dll" quick-weapons-native-test/
                queue+=("quick-weapons-native-test/$dll")
              fi
            done < <(objdump -p "$file" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr -d '\r')
          done
          ls -lh quick-weapons-native-test/
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: quick-weapons-native-test
          path: quick-weapons-native-test/*
          if-no-files-found: error
