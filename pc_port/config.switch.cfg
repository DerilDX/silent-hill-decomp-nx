# Silent Hill — recommended config for Nintendo Switch (Tegra X1).
# Copy to gamedata/config.cfg. Keys not listed here keep their defaults;
# see config.cfg for the full annotated list.
config_version = 3

# --- Frame rate -------------------------------------------------------------
# 30 = PSX-accurate and the only rate the Switch holds steadily.
fps_cap = 30
vsync = 1
menu_fps_unlock = 0
# Rain/snow stepped at the console's own 30 Hz: half the simulation work.
weather_sim_hz = 30

# --- Picture ----------------------------------------------------------------
# Resolution is forced to 1280x720 on Switch; width/height are ignored.
widescreen_mode = 1
widescreen_zoom = 1.2
menu_pillarbox = 1
dithering = 1
texture_filter = 0
scaling = 2
# Anisotropic filtering does nothing for point-sampled PSX textures.
aniso_level = 0
# Perspective-correct textures: cheap CPU-side, fixes the PSX warping.
use_pgxp = 1
# MSAA / post-process / tone-mapping cost GPU bandwidth the X1 doesn't have.
msaa = 0
post_process = 0
tonemap = 0

# --- Lighting ---------------------------------------------------------------
# Classic PSX flashlight. 1 = Classic+Shadows if you want to try shadows.
flashlight_mode = 0
flashlight_shadows = 0
shadow_resolution = 1024
per_pixel_lighting = 0
chara_per_pixel_light = 0
hero_light = 0
dream_blur = 1

# --- World / fog ------------------------------------------------------------
# Vanilla fog and draw distance: the thinner-fog "whole town" mode is far too
# heavy for the Switch.
fog_strength = 1.10
draw_distance_pct = 100
whole_map_exteriors = 0
disable_culling = 1
preload_chunks = 1

# --- Memory / IO ------------------------------------------------------------
resident_textures = 1
# 1 keeps every character's assets resident (42 sets loaded at boot) so the
# console can spawn anything anywhere: slow startup and RAM the Switch needs.
global_chara_pool = 0
# No texture packs on Switch: their caches assume desktop RAM/VRAM.
texture_packs = 0
texpack_cache_mb = 256
texpack_budget_mb = 512
# Loose-file overrides add an SD-card fopen probe to every asset load.
allow_loose_files = 0

# --- Misc -------------------------------------------------------------------
skip_intros = 0
language = auto
disc_image =
attract_demos = 1
bullet_decals = 0
discord_rich_presence = 0
retroachievements = 0
enable_plugins = 0
enable_debug_log = 0
allow_debug_controls = 0
# 0 = off. 1..4 shows an FPS counter (handy for testing).
fps_display = 0
controller_movement = both
